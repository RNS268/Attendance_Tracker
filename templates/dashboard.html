<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .live-feed-card {
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
    }

    #liveFeed {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .feed-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ff4444;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 10px #ff4444;
    }

    .live-label {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
    }

    .placeholder-text {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      max-width: 300px;
      line-height: 1.4;
    }

    .table-container {
      background: var(--surface-elevated);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 16px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-row">
      <div>
        <h1>Attendance</h1>
        <p class="subtitle">System Status: <span style="color:var(--success)">Online</span></p>
      </div>
      <div class="nav">
        <a href="/register_face" class="btn btn-secondary">Register New</a>
        <button type="button" class="btn btn-secondary" id="logout">Logout</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="today">Dashboard</div>
      <div class="tab" data-tab="history">History</div>
      <div class="tab" data-tab="people">People</div>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="today" class="tab-content active">
      <div class="live-feed-card">
        <div class="feed-overlay">
          <div class="live-label"><span class="status-dot"></span>Live View</div>
        </div>
        <img id="liveFeed" src="" alt="Live Feed" style="display: none;"
          onerror="this.style.display='none'; document.getElementById('placeholder').style.display='flex';">
        <div id="placeholder" class="placeholder-text" style="display: flex;">
          Wait for capture...<br>Trigger the ESP32-CAM to update this feed.
        </div>
      </div>

      <div class="card">
        <div class="section-header">
          <h2>Today's Logs</h2>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-danger btn-sm" id="clearToday">Clear Today</button>
            <button type="button" class="btn btn-primary btn-sm" id="refreshToday">Refresh</button>
          </div>
        </div>
        <div id="msg" class="msg" hidden></div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Name</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tbodyToday">
              <tr>
                <td colspan="3" class="empty-state">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- HISTORY TAB -->
    <div id="history" class="tab-content">
      <div class="card">
        <div class="section-header">
          <h2>Attendance History</h2>
          <button type="button" class="btn btn-primary btn-sm" id="refreshHistory">Refresh</button>
        </div>
        <div id="historyContainer">
          <div class="empty-state">Loading history...</div>
        </div>
      </div>
    </div>

    <!-- PEOPLE TAB -->
    <div id="people" class="tab-content">
      <div class="card">
        <div class="section-header">
          <h2>Registered People</h2>
          <button type="button" class="btn btn-primary btn-sm" id="refreshPeople">Refresh</button>
        </div>
        <div id="peopleList">
          <div class="empty-state">Loading people...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script>
    // Tab switching logic
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const contentId = tab.getAttribute('data-tab');
        document.getElementById(contentId).classList.add('active');

        // Load data for the tab
        if (contentId === 'today') loadToday();
        if (contentId === 'history') loadHistory();
        if (contentId === 'people') loadPeople();
      });
    });

    function getStatusBadge(status) {
      status = status.toLowerCase();
      if (status === 'recognized') return `<span class="badge badge-success">Recognized</span>`;
      if (status === 'already_marked') return `<span class="badge badge-info">Logged</span>`;
      if (status === 'not_clear') return `<span class="badge badge-warning">Not Clear</span>`;
      if (status === 'no_face') return `<span class="badge badge-error">No Face</span>`;
      if (status === 'unknown') return `<span class="badge badge-error">Unknown</span>`;
      return `<span class="badge">${status}</span>`;
    }

    function formatTime(s) {
      if (!s) return "—";
      try {
        const d = new Date(s);
        return isNaN(d.getTime()) ? s : d.toLocaleString([], { hour: '2-digit', minute: '2-digit' });
      } catch (_) { return s; }
    }

    // --- DASHBOARD (TODAY) ---
    async function loadToday() {
      const tbody = document.getElementById("tbodyToday");
      try {
        const r = await fetchApi("/api/dashboard");
        const data = await r.json();
        const rows = data.attendance || [];
        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No attendance records today.</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(x => `
          <tr>
            <td><span style="color:var(--muted)">${formatTime(x.logged_at)}</span></td>
            <td><strong style="color:var(--accent)">${escapeHtml(x.name)}</strong></td>
            <td>${getStatusBadge(x.status)}</td>
          </tr>
        `).join("");
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">Failed to load.</td></tr>';
      }
    }

    document.getElementById("clearToday").addEventListener("click", async () => {
      if (!confirm("Are you sure you want to clear today's logs?")) return;
      try {
        await fetchApi("/api/attendance/today", { method: "DELETE" });
        loadToday();
      } catch (e) { alert("Failed to clear logs."); }
    });

    // --- HISTORY ---
    async function loadHistory() {
      const container = document.getElementById("historyContainer");
      try {
        const r = await fetchApi("/api/attendance/history");
        const data = await r.json();
        const history = data.history || {};
        const dates = Object.keys(history).sort().reverse();

        if (dates.length === 0) {
          container.innerHTML = '<div class="empty-state">No historical data found.</div>';
          return;
        }

        container.innerHTML = dates.map(date => {
          const logs = history[date];
          const dateObj = new Date(date);
          const formattedDate = dateObj.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });

          return `
            <div class="history-day">
              <h3>${formattedDate}</h3>
              <div class="table-container">
                <table>
                  <thead><tr><th>Time</th><th>Name</th><th>Status</th></tr></thead>
                  <tbody>
                    ${logs.map(x => `
                      <tr>
                        <td><span style="color:var(--muted)">${formatTime(x.logged_at)}</span></td>
                        <td><strong>${escapeHtml(x.name)}</strong></td>
                        <td>${getStatusBadge(x.status)}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }).join("");
      } catch (e) { container.innerHTML = '<div class="empty-state">Failed to load history.</div>'; }
    }

    // --- PEOPLE ---
    async function loadPeople() {
      const container = document.getElementById("peopleList");
      try {
        const r = await fetchApi("/api/registered_faces");
        const data = await r.json();
        const people = data.people || [];

        if (people.length === 0) {
          container.innerHTML = '<div class="empty-state">No people registered yet.</div>';
          return;
        }

        container.innerHTML = people.map(name => `
          <div class="person-card">
            <div class="person-info">
              <div class="person-avatar">${name.charAt(0).toUpperCase()}</div>
              <strong>${escapeHtml(name)}</strong>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteFace('${escapeJs(name)}')">Delete</button>
          </div>
        `).join("");
      } catch (e) { container.innerHTML = '<div class="empty-state">Failed to load people.</div>'; }
    }

    async function deleteFace(name) {
      if (!confirm(`Are you sure you want to delete the registered face for "${name}"?`)) return;
      try {
        const r = await fetchApi(`/api/registered_faces/${encodeURIComponent(name)}`, { method: "DELETE" });
        if (r.ok) {
          loadPeople();
        } else {
          const data = await r.json();
          alert("Error: " + (data.error || "Failed to delete"));
        }
      } catch (e) { alert("Network error."); }
    }

    function escapeJs(t) {
      return t.replace(/'/g, "\\'");
    }

    function escapeHtml(t) {
      const div = document.createElement("div");
      div.textContent = t;
      return div.innerHTML;
    }

    // --- LIVE FEED ---
    const liveFeed = document.getElementById("liveFeed");
    const placeholder = document.getElementById("placeholder");
    let previousBlobUrl = null;

    async function updateFeed() {
      try {
        const r = await fetch("/api/latest_frame?t=" + Date.now(), { credentials: "same-origin" });
        if (!r.ok) return;
        const blob = await r.blob();
        if (blob.size < 100) return;
        const blobUrl = URL.createObjectURL(blob);
        if (previousBlobUrl) URL.revokeObjectURL(previousBlobUrl);
        previousBlobUrl = blobUrl;
        liveFeed.src = blobUrl;
        liveFeed.style.display = "block";
        placeholder.style.display = "none";
      } catch (e) { }
    }

    setInterval(updateFeed, 1000);
    updateFeed();

    // Initial load
    loadToday();

    document.getElementById("refreshToday").addEventListener("click", loadToday);
    document.getElementById("refreshHistory").addEventListener("click", loadHistory);
    document.getElementById("refreshPeople").addEventListener("click", loadPeople);
    document.getElementById("logout").addEventListener("click", async () => {
      await fetchApi("/logout", { method: "POST" });
      window.location.href = "/login";
    });
  </script>
</body>

</html>
